<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Tienda</title>

    <!-- Bootstrap CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">Mi Tienda</a>

        <span class="badge bg-danger fs-6" id="badge">0</span>
      </div>
    </nav>

    <div class="container my-5">
      <div class="row">
        <!-- Productos -->
        <div class="col-lg-8">
          <h2 class="mb-4">Productos</h2>

          <div class="row g-4">
            <!-- Producto 1 -->
            <div class="col-md-6">
              <div class="card h-100">
                <div class="card-body">
                  <h5 class="card-title">Laptop</h5>
                  <p class="card-text">$2,500.00</p>

                  <button
                    class="btn btn-primary btn-agregar"
                    data-nombre="Laptop"
                    data-precio="2500"
                  >
                    Agregar
                  </button>
                </div>
              </div>
            </div>

            <!-- Producto 2 -->
            <div class="col-md-6">
              <div class="card h-100">
                <div class="card-body">
                  <h5 class="card-title">Mouse Gamer</h5>
                  <p class="card-text">$45.00</p>

                  <button
                    class="btn btn-primary btn-agregar"
                    data-nombre="Mouse Gamer"
                    data-precio="45"
                  >
                    Agregar
                  </button>
                </div>
              </div>
            </div>

            <!-- Producto 3 -->
            <div class="col-md-6">
              <div class="card h-100">
                <div class="card-body">
                  <h5 class="card-title">Teclado Mecánico</h5>
                  <p class="card-text">$120.00</p>

                  <button
                    class="btn btn-primary btn-agregar"
                    data-nombre="Teclado Mecánico"
                    data-precio="120"
                  >
                    Agregar
                  </button>
                </div>
              </div>
            </div>

            <!-- Producto 4 -->
            <div class="col-md-6">
              <div class="card h-100">
                <div class="card-body">
                  <h5 class="card-title">Monitor 24"</h5>
                  <p class="card-text">$350.00</p>

                  <button
                    class="btn btn-primary btn-agregar"
                    data-nombre='Monitor 24"'
                    data-precio="350"
                  >
                    Agregar
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Carrito -->
        <div class="col-lg-4">
          <div class="card">
            <div class="card-body">
              <h3>Carrito</h3>

              <ul id="lista-carrito" class="list-group mb-3">
                <li id="msg-vacio" class="list-group-item text-center">
                  Tu carrito está vacío
                </li>
              </ul>

              <h5>
                Total:
                <span id="total">$0.00</span>
              </h5>

              <button id="btn-vaciar" class="btn btn-danger mt-3">
                Vaciar carrito
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JS -->
    <script src="app.js"></script>
  </body>
</html>
